[package]
name = "slapp"
version = "0.1.0"
edition = "2024"

[lib]
name = "slapp"
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
nix = { version = "0.31.3", features = ["net"] }
nfq = { package = "nfq-razor-temp-release", version = "0.2.6" }
etherparse = "0.19.0"
tokio = { version = "1.52.3", features = ["full", "rt"] }
